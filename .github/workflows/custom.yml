name: Build customized u-boot

on:
  workflow_dispatch:
    inputs:
      flash:
        description: 'Flash Type'
        required: true
        type: choice
        options:
        - 'NOR'
        - 'NAND'
        - 'NAND-NMBM'
      mtdparts:
        description: 'MTD Partition Table'
        required: true
        type: string
        default: '192k(u-boot),64k(u-boot-env),64k(factory),-(firmware)'
      kernel_offset:
        description: 'Kernel Load Address'
        required: true
        type: string
        default: '0x50000'
      reset_pin:
        description: 'Reset Button GPIO'
        required: true
        type: number
        default: -1
      sysled_pin:
        description: 'System LED GPIO'
        required: true
        type: number
        default: -1
      cpufreq:
        description: 'CPU Frequency (400 - 1200)'
        required: true
        type: number
        default: '880'
      ramfreq:
        description: 'DRAM Frequency'
        required: true
        type: choice
        options:
        - '400'
        - '800'
        - '1066'
        - '1200'
        default: '800'
      ddrparam:
        description: 'Prefered DDR Init Parameters'
        required: true
        type: choice
        options:
        - 'DDR2-64MiB'
        - 'DDR2-128MiB'
        - 'DDR2-W9751G6KB-64MiB-1066MHz'
        - 'DDR2-W971GG6KB25-128MiB-800MHz'
        - 'DDR2-W971GG6KB18-128MiB-1066MHz'
        - 'DDR3-128MiB'
        - 'DDR3-256MiB'
        - 'DDR3-512MiB'
        - 'DDR3-128MiB-KGD'
      oldparam:
        description: 'Use Old DDR Timing Parameters'
        required: true
        type: boolean
        default: 'false'
      baudrate:
        description: 'Baud Rate'
        required: true
        type: choice
        options:
        - '57600'
        - '115200'

jobs:
  build:
    name: Build MT7621 u-boot
    runs-on: ubuntu-latest
    strategy:
       fail-fast: False

    steps:
      - name: Checkout master directory
        uses: actions/checkout@v4
        with:
          path: uboot-mt7621

      - name: Install essential packages
        run: |
          sudo apt-get update
          sudo apt-get install -y swig python3-dev python-is-python3
          python --version

      - name: Download OpenWrt toolchain
        run: |
          wget -O - https://github.com/DragonBluep/uboot-mt7621/releases/download/20230517/openwrt-toolchain-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz \
            | tar --xz -xf -

      - name: Disable pylibfdt build
        working-directory: uboot-mt7621
        run: |
          sed -i '/pylibfdt/d' scripts/dtc/Makefile
          echo "--- remaining pylibfdt refs: $(grep -c pylibfdt scripts/dtc/Makefile || true) ---"

      - name: Set old DDR timing parameters
        if:  ${{ inputs.oldparam }}
        working-directory: uboot-mt7621
        run: sed -i 's/0x0C000000/0x0A000000/g' ./arch/mips/mach-mt7621/dramc-legacy/dramc.S

      - name: Compile
        working-directory: uboot-mt7621
        run: |
          ./customize.sh '${{ inputs.flash }}' '${{ inputs.mtdparts }}' '${{ inputs.kernel_offset }}' '${{ inputs.reset_pin }}' \
            '${{ inputs.sysled_pin }}' '${{ inputs.cpufreq }}' '${{ inputs.ramfreq }}' '${{ inputs.ddrparam }}' '${{ inputs.baudrate }}'

      - name: Assemble flash image (replace binman)
        working-directory: uboot-mt7621
        run: |
          ALIGN=$(grep -E '^CONFIG_SPL_ALIGN_TO=' .config | cut -d= -f2)
          ALIGN=${ALIGN:-0x10000}
          echo "SPL_ALIGN_TO = $ALIGN"
          ls -l u-boot-mt7621-spl.bin u-boot-lzma.img u-boot.bin
          python3 - "$ALIGN" <<'PYEOF'
          import sys, os
          align = int(sys.argv[1], 0) or 0
          spl = open('u-boot-mt7621-spl.bin', 'rb').read()
          lz  = open('u-boot-lzma.img', 'rb').read()
          pad = ((-len(spl)) % align) if align else 0
          img = spl + b'\xff' * pad + lz
          open('u-boot-mt7621.bin', 'wb').write(img)
          print("spl      = %d bytes" % len(spl))
          print("padding  = %d bytes" % pad)
          print("lzma img = %d bytes" % len(lz))
          print("total    = %d bytes (0x%X)" % (len(img), len(img)))
          print("partition 0x30000 = 196608 ->", "OK" if len(img) <= 0x30000 else "TOO BIG")
          os.makedirs('archive', exist_ok=True)
          open('archive/u-boot-mt7621.bin', 'wb').write(img)
          print("copied to archive/u-boot-mt7621.bin")
          PYEOF

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: u-boot
          path: "uboot-mt7621/archive/"
